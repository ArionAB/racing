# CI — smoke test headless pentru Toy Racer.
# Ruleaza la fiecare push si PR: descarca Godot, importa resursele si booteaza
# scena principala cateva cadre in --headless. Pica daca Godot raporteaza erori
# de script/parse/load. Scop: prinde regresiile de incarcare inainte de merge.
#
# Bump de versiune Godot: schimba doar GODOT_VERSION mai jos (trebuie sa fie
# identica cu config/features din project.godot).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GODOT_VERSION: "4.7"

jobs:
  headless-smoke:
    name: Headless smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL -o /tmp/godot.zip "${BASE}/${ZIP}"
          unzip -o /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Godot version
        run: ~/godot-bin/godot --version

      # Importul poate avea nevoie de doua treceri (resurse care depind unele de
      # altele). Nu esuam pe codul de iesire aici — verificam log-urile la final.
      - name: Import resources
        run: |
          ~/godot-bin/godot --headless --import 2>&1 | tee import.log || true
          ~/godot-bin/godot --headless --import 2>&1 | tee -a import.log || true

      - name: Boot main scene (headless)
        run: |
          ~/godot-bin/godot --headless --quit-after 180 2>&1 | tee run.log || true

      - name: Fail on script / parse / load errors
        run: |
          set -euo pipefail
          PATTERN='SCRIPT ERROR|Parse Error|Failed to load|Failed to instantiate|Cannot open file'
          if grep -nEi "$PATTERN" import.log run.log; then
            echo "::error::Godot a raportat erori de script/parse/load — vezi liniile de mai sus."
            exit 1
          fi
          echo "OK — niciun error de script/parse/load."

      # Un material = (cel putin) un draw call, iar draw call-urile sunt
      # constrangerea pentru 60fps pe mid-range. Garda prinde regresia clasica:
      # StandardMaterial3D.new() intr-o bucla de decor, care da un material per
      # instanta. Vezi tools/probe_decor.gd pentru prag si cifrele de referinta.
      - name: Draw-call guard (materiale per pista)
        run: |
          set -uo pipefail
          ~/godot-bin/godot --headless --script res://tools/probe_decor.gd 2>&1 | tee probe.log
          STATUS=${PIPESTATUS[0]}
          # Verificam si verdictul, nu doar codul: daca sonda moare inainte sa
          # termine pistele, absenta verdictului e ea insasi un esec.
          if ! grep -q 'VERDICT:' probe.log; then
            echo "::error::Garda nu a rulat pana la capat (niciun verdict in log)."
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] || grep -q 'VERDICT: PROBLEMA' probe.log; then
            echo "::error::Prea multe materiale distincte pe cel putin o pista — vezi tabelul de mai sus."
            exit 1
          fi
          echo "OK — garda de draw call-uri a trecut."

      # Peretii de canion sunt ~130 de forme convexe puse cap la cap. Imbinarile
      # dintre ele sunt exact locul unde o masina se poate agata, iar un blocaj
      # inseamna cursa terminata pentru jucator. Proba arunca masini in unghi in
      # perete si verifica daca AI-ul (care are anti-blocaj cu marsarier) scapa.
      - name: Anti-blocaj in peretii de canion
        run: |
          set -uo pipefail
          ~/godot-bin/godot --headless --fixed-fps 60 \
            res://tools/ProbeRace.tscn -- --mode=cliff --track=0 2>&1 | tee cliff.log
          STATUS=${PIPESTATUS[0]}
          if ! grep -q 'VERDICT:' cliff.log; then
            echo "::error::Proba de anti-blocaj nu a rulat pana la capat."
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] || grep -q 'VERDICT: PROBLEMA' cliff.log; then
            echo "::error::Masini intepenite in peretii de canion — vezi tabelul de mai sus."
            exit 1
          fi
          echo "OK — nicio masina intepenita."

      # Soseaua e un platou cu fuste verticale de 3 m, iar terenul de langa ea
      # sta mai jos — deci marginea drumului poate deveni un prag pe care un
      # CharacterBody3D (fara step-up in Godot) nu-l mai urca. S-a intamplat: pe
      # Dunele, 6 din 9 incercari de reintrare esuau, si intr-o cursa cu AI o
      # masina a stat 22% din timp blocata pe nisip. Racordul il face umarul
      # soselei; proba verifica exact ca a ramas racord.
      - name: Reintrarea pe sosea dupa iesirea pe nisip
        run: |
          set -uo pipefail
          ~/godot-bin/godot --headless --fixed-fps 60 \
            res://tools/ProbeReentry.tscn -- --mode=drive --track=0 2>&1 | tee reentry.log
          STATUS=${PIPESTATUS[0]}
          if ! grep -q 'VERDICT:' reentry.log; then
            echo "::error::Proba de reintrare nu a rulat pana la capat."
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] || grep -q 'VERDICT: PROBLEMA' reentry.log; then
            echo "::error::Masini care nu mai pot intra pe sosea — vezi tabelul de mai sus."
            exit 1
          fi
          echo "OK — se poate reintra de peste tot."
